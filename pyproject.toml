[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phenokit"
version = "0.1.0"
description = "Sensor-to-insight toolkit for UAV/ground crop phenotyping: acquisition planning, data management, QC, calibration and AI/computer-vision trait extraction for RGB, multispectral, hyperspectral, thermal and LiDAR data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pillow>=9.0",
  "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/agyeyapratap-sketch/phenokit"
Issues = "https://github.com/agyeyapratap-sketch/phenokit/issues"
Changelog = "https://github.com/agyeyapratap-sketch/phenokit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
deep = ["torch>=2.0"]
geo = ["rasterio>=1.3", "laspy>=2.4"]
dev = ["pytest>=7"]

[project.scripts]
phenokit = "phenokit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
